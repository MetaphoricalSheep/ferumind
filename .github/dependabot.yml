version: 2

# Nothing here routes a pull request to a person. The auto tiers merge
# themselves once required checks pass, so a review request or an assignment
# would only generate mail for something already handled. Manual-tier PRs
# (majors, `mcp`) wait in the pull request list until the owner looks; that is
# deliberate, not an oversight.
#
# Tier policy (REL-034): see docs/dependencies.md. Groups below cut the weekly
# PR count; `.github/workflows/dependabot-auto-merge.yml` enables GitHub native
# auto-merge only for the auto tiers. Majors and `mcp` stay ungrouped and
# manual. Version-update cooldown is left at Dependabot's platform default
# (3 days); do not set `cooldown.default-days: 0`.

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      uv-patches:
        patterns:
          - "*"
        exclude-patterns:
          - "mcp"
        update-types:
          - patch

  - package-ecosystem: npm
    directory: /.opencode
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      opencode-npm-patches:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
