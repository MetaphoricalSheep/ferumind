name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_FROZEN: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Verify
        run: scripts/verify.sh

      - name: Audit Python environment
        if: matrix.python-version == '3.12'
        run: uv run pip-audit --strict --progress-spinner=off

      - name: Audit OpenCode dependencies
        if: matrix.python-version == '3.12'
        working-directory: .opencode
        run: npm audit --package-lock-only --omit=dev

      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: uv build

      - name: Inspect distributions
        if: matrix.python-version == '3.12'
        run: uv run python scripts/check_distribution.py dist

      - name: Smoke-test installed wheel
        if: matrix.python-version == '3.12'
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          uv run --isolated --no-project --with "$wheel" lattice --help
