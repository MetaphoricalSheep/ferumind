# Gold labels for the retrieval benchmark. See README.md for how to add a case.
#
# Produced by the blind two-pass procedure: three independent agents wrote
# candidate queries from invented intents before any document existed, and
# different agents wrote the documents from those same intents without ever
# seeing the queries. Selection was mechanical, never by taste --- paraphrase
# cases take the lowest stemmed overlap against their gold span, every other
# category takes a fixed positional pick.
#
# 'notes' records which model produced the selected phrasing and that case's
# stemmed content-word overlap with its gold span.
# RET-06: semantic label audit + post-distractor also_relevant/gold merges.

