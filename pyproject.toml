[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "ferumind"
version = "0.1.0"
description = "A Markdown memory for your AI chats, running on your own machine"
# Upper bound is deliberate: every allowed minor is exercised in CI.
# Raising it means adding that minor to the CI matrix in the same change —
# tests/unit/test_release_controls.py::test_supported_python_range_matches_ci
# fails otherwise. See docs/python-support.md.
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "markdown", "knowledge-management", "ai-agents", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

dependencies = [
  "pydantic>=2.0,<3",
  "typer>=0.27.1,<1",
  "rich>=13.0,<16",
  # Capped to the tested majors. 1.x is in security-only maintenance upstream,
  # so Ferumind moved to 2.x (REL-035). Two private SDK attachment points
  # remain — ``_lowlevel_server`` (custom stdio transport, resources/read
  # handler) and ``_tool_manager`` (to reach its public accessors) — and they
  # carry no compatibility guarantee, so an untested major can break startup,
  # result conversion, or the tool boundary. Widen only against a run of the
  # full surface suite on the new version; the guard in
  # tests/unit/test_mcp_hardening.py fails if this drifts, and the CI
  # compatibility matrix derives its rows from this specifier, so widening it
  # widens the matrix. See docs/mcp-sdk-support.md.
  # Declared without the `cli` extra: it adds only typer, which is already a
  # direct dependency above, and python-dotenv, which nothing imports —
  # scripts/ferumind-mcp-stdio loads env files in the shell before exec.
  "mcp>=2.0.0,<3",
  "pyyaml>=6.0,<7",
  "httpx>=0.27,<1",
  "regex>=2024.11.6,<2027",
  "pillow>=11.0,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
  "coverage>=7.0,<8",
  "ruff>=0.6,<1",
  "pyright>=1.1,<2",
  "types-pyyaml>=6.0,<7",
  "pip-audit>=2.9,<3",
  # PEP 440 comparison for scripts/mcp_matrix_versions.py. Already present as a
  # transitive dependency, declared directly because a script depends on it:
  # hand-rolled version ordering gets 2.10.0 vs 2.9.0 wrong.
  "packaging>=24.0,<27",
]

[project.urls]
Homepage = "https://github.com/MetaphoricalSheep/ferumind"
Repository = "https://github.com/MetaphoricalSheep/ferumind"
Issues = "https://github.com/MetaphoricalSheep/ferumind/issues"

[project.scripts]
ferumind = "ferumind.cli.main:app"

[tool.hatch.build]
exclude = [
  "/.env",
  "/.opencode/node_modules",
  "/.venv",
  "/dist",
  "/htmlcov",
  "/workspace/*",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "F",    # pyflakes
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
  "PIE",  # flake8-pie
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "ARG",  # flake8-unused-arguments
  "LOG",  # flake8-logging-format
  "N",    # pep8-naming
  "RUF",  # Ruff-specific
  "S",    # flake8-bandit security checks
]
ignore = [
  "E501",       # line length handled by formatter
  "LOG009",     # no % formatting on logging — false positives with f-strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ARG001",     # unused arguments in test fixtures
  "PT004",      # not returning from fixture
  "PT007",      # param value mismatches
  "S101",       # assert allowed in tests
  "S104",       # adversarial network-address fixtures
  "S105",       # intentional secret-looking redaction fixtures
  "S106",       # compact tokens are identifiers, not passwords
  "S108",       # inert snapshot-path fixtures
  "S603",       # fixed test-only subprocess commands
  "S607",       # fixed executables resolved from the test environment
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
# Resolve `from bootstrap_workspace import bootstrap` in tests/conftest.py,
# which adds scripts/ to sys.path at runtime.
extraPaths = ["scripts"]
exclude = [
  "**/__pycache__",
  ".venv",
  "workspace",
  ".pyright",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
strict_markers = true
strict_config = true
markers = [
  "smoke: real-subprocess MCP smoke harness over stdio (tests/smoke); see docs/smoke-harness.md",
]
addopts = [
  "--strict-markers",
  "--tb=short",
  "-ra",
  "--cache-clear",
]

[tool.coverage.run]
source = ["src/ferumind"]
omit = [
  "*/migrations/*",
  "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.coverage.html]
title = "Ferumind Coverage Report"
